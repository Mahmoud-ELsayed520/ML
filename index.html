.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--vi));transition:width .4s}
.tag{font-size:.75rem;padding:2px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);display:inline-block}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
.note{border-inline-start:4px solid var(--vi);padding:4px 12px;background:rgba(139,92,246,.1);border-radius:8px;margin:10px 0}
.warn{border-inline-start:4px solid var(--no);padding:4px 12px;background:rgba(239,68,68,.08);border-radius:8px;margin:10px 0}
.opt{display:block;width:100%;text-align:start;margin:6px 0}.opt.ok{border-color:var(--ok);background:rgba(34,197,94,.15)}.opt.no{border-color:var(--no);background:rgba(239,68,68,.15)}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{border:1px solid var(--bd);padding:6px;text-align:center}
.wrap{overflow-x:auto}pre{direction:ltr;text-align:left;background:#0a0e1a;color:#cfe0ff;padding:12px;border-radius:10px;overflow-x:auto;font-size:.8rem}

.fc{min-height:80px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;margin:0}
svg{max-width:100%;height:auto}
@media print{:root{--bg:#fff;--card:#fff;--tx:#000;--mu:#333;--bd:#999}header,.noprint{display:none!important}.onlyprint{display:block!important}body{background:#fff;color:#000;font-size:11pt}.card{break-inside:avoid}main{max-width:100%}}

{t:'Pretrained vs Transfer Learning vs Fine-Tuning',x:'',b:`
<div class="wrap"><table><tr><th>المصطلح</th><th>المعنى</th><th>تشبيه الدكتور</th></tr>
<tr><td>Pretrained Model</td><td>موديل متدرّب مسبقًا على بيانات كبيرة (مثل ImageNet) وأوزانه محفوظة. هو <b>الأداة</b></td><td>طبيب خلّص 10 سنين تدريب عام</td></tr>
<tr><td>Transfer Learning</td><td>الاستراتيجية: نقل المعرفة من مهمة لمهمة مختلفة لكن مرتبطة</td><td>إرسال الطبيب لكورس تخصص قلب أسبوعين</td></tr>
<tr><td>Fine-Tuning</td><td>نوع محدد من Transfer Learning: نكمل تدريب الموديل (كل أو بعض الطبقات) على بيانات جديدة</td><td>المذاكرة الفعلية خلال الكورس</td></tr></table></div>
<div class="warn"><b>سؤال شائع:</b> هل Pretrained model = Transfer learning؟ لأ. Pretrained هو الأداة، و Transfer learning هو الأسلوب.</div>`,
 q:{q:'Fine-tuning هو:',o:['موديل متدرّب مسبقًا','نوع من Transfer Learning بنكمل فيه التدريب على بيانات جديدة','تقسيم البيانات','نوع من Clustering'],a:1,w:'حسب تعريف المحاضرة.'}},
{t:'مصطلحات ML الأساسية',x:'flash',b:`<p>اضغط على الكارت علشان يتقلب:</p>`,

{lec:2,t:'ما هي Linear Regression؟',x:'',b:`
<p><b>Lecture Content:</b> الـ ${E('Linear regression')} طريقة إحصائية لتوقّع العلاقة بين متغيرين. بتفترض إن فيه علاقة خطية بين ${E('independent')} (المدخل X) و${E('dependent')} (الناتج Y)، وتدوّر على أحسن خط مستقيم يوصف العلاقة دي.</p>
<p><b>${E('Regression')} vs ${E('Classification')}:</b> Regression لما الهدف المتوقع <b>مستمر</b> (درجات الطلبة، أسعار الألماس). Classification لما الهدف <b>فئات منفصلة</b> (spam أو لا، Yes/No، 0 أو 1).</p>
<p><b>${E('Simple linear regression')}:</b> متغير مستقل واحد + متغير تابع واحد. النموذج بيحسب ${E('slope')} و${E('intercept')} للخط. الـ Slope = قد إيه Y بيتغير لكل وحدة تغيير في X. الـ Intercept = القيمة المتوقعة لـ Y لما X = 0.</p>
<p>موضع الخط بيتحدد بتقليل مجموع مربعات الفروق بين القيم المتوقعة والقيم الفعلية.</p>
<div class="note"><b>Exam note:</b> Linear regression ممكن تتوسع لـ Multiple (أكتر من مدخل) و Logistic (للـ binary classification).</div>`,
 q:{q:'الـ Intercept في Simple Linear Regression يمثل:',o:['التغيّر في Y لكل وحدة في X','القيمة المتوقعة لـ Y عندما X = 0','عدد العيّنات','قيمة الـ residual'],a:1,w:'الشرح في المحاضرة: intercept = projected value of dependent variable when independent equals zero.'}},
{lec:2,t:'معادلة الخط المستقيم',x:'line',b:`
<p><b>المعادلة:</b> <span class="en">Yi = β₀ + β₁Xi</span></p>
<div class="wrap"><table><tr><th>الرمز</th><th>المعنى</th></tr><tr><td>Yi</td><td>Dependent variable (الناتج)</td></tr><tr><td>β₀</td><td>Constant / Intercept</td></tr><tr><td>β₁</td><td>Slope</td></tr><tr><td>Xi</td><td>Independent variable (المدخل)</td></tr></table></div>
<div class="warn"><b>ملاحظة على السلايد:</b> السلايد كاتب "β1 = Slope/Intercept"، والمقصود طبقًا لشرح نفس المحاضرة هو <b>Slope</b> فقط.</div>
<p>الخوارزمية هدفها تحديد أحسن قيم لـ β₀ و β₁ بحيث الفرق بين القيم المتوقعة والفعلية أقل ما يمكن. <b>جرّب بنفسك:</b></p>`,
 q:{q:'في Y = β₀ + β₁X، إيه اللي بيتغير لما نزوّد β₁؟',o:['الخط بيتحرك لأعلى فقط','ميل الخط (Slope)','عدد النقاط','لا شيء'],a:1,w:'β₁ هو الـ Slope. β₀ هو اللي بيحرك الخط لأعلى/لأسفل.'}},
{lec:2,t:'أنواع العلاقات و correlation (r)',x:'scatter',b:`
<p>المحاضرة بتقسم العلاقات لأربعة أنواع:</p>
<div class="wrap"><table><tr><th>النوع</th><th>الوصف</th><th>مثال المحاضرة</th><th>r</th></tr>
<tr><td>Positive linear</td><td>X يزيد فـ Y يزيد، خط صاعد</td><td>ساعات المذاكرة ↔ الدرجات</td><td>> 0 وقريب من +1</td></tr>
<tr><td>Negative linear</td><td>X يزيد فـ Y يقل، خط نازل</td><td>حرارة الجو ↔ فاتورة التدفئة</td><td>< 0 وقريب من −1</td></tr>
<tr><td>No relationship</td><td>نقاط عشوائية</td><td>مقاس الحذاء ↔ عدد الأفلام</td><td>≈ 0</td></tr>
<tr><td>Non-linear</td><td>علاقة موجودة لكن مش خط مستقيم</td><td>سرعة العربية ↔ كفاءة الوقود</td><td>مش كافي لوصفها</td></tr></table></div>
<p>الرسومات دي نقاط افتراضية لتوضيح الشكل، وقيمة r بتتحسب منها:</p>`,
 q:{q:'علاقة مقاس الحذاء بعدد الأفلام المشاهدة سنويًا (حسب المحاضرة):',o:['Positive','Negative','No relationship (r ≈ 0)','Non-linear'],a:2,w:'المحاضرة استخدمت المثال ده لعدم وجود ارتباط.'}},
{lec:2,t:'Best-Fit Line و Residuals و RSS',x:'resid',b:`
<p>الـ <b>${E('Residual')}</b> (${E('Random Error')}) = الفرق بين القيمة الفعلية <span class="en">yi</span> والقيمة المتوقعة (${E('predicted')}).</p>
<p>الـ <b>${E('Best-fit line')}</b> هو الخط اللي بيقلل <b>${E('Residual Sum of Squares (RSS)')}</b> رياضيًا.</p>
<p><b>جرّب:</b> حرّك الـ sliders وشوف RSS. الخطوط الحمراء هي الـ residuals.</p>`,
 q:{q:'الـ Residual هو:',o:['ميل الخط','الفرق بين القيمة الفعلية والمتوقعة','عدد النقاط','متوسط X'],a:1,w:'حسب تعريف المحاضرة.'}},
{lec:2,t:'Model Representation (أسعار بيوت Portland)',x:'',b:`
<p><b>المثال:</b> أسعار البيوت في Portland: y = السعر بالألف دولار، x = المساحة بالقدم المربع. الهدف: نتوقع سعر بيت صاحبك مساحته 1250 sq.ft. المحاضرة بتقول إن الخط بيدّي حوالي <b>$250,000</b>.</p>
<p>ده ${E('Supervised Learning')} لأن كل نقطة معاها "الإجابة الصح"، وده ${E('Regression problem')} لأن الناتج رقم حقيقي.</p>
<div class="wrap"><table><tr><th>الرمز</th><th>المعنى</th></tr>
<tr><td>Training set</td><td>البيانات (x, y) اللي بنتدرب عليها</td></tr><tr><td>m</td><td>عدد أمثلة التدريب (في المثال m = 47)</td></tr>
<tr><td>x</td><td>المدخل / Feature</td></tr><tr><td>y</td><td>المخرج / Target</td></tr><tr><td>(x, y)</td><td>مثال تدريب واحد</td></tr>
<tr><td>(x⁽ⁱ⁾, y⁽ⁱ⁾)</td><td>مثال التدريب رقم i</td></tr></table></div>
<div class="warn"><b>خطأ شائع:</b> الـ (i) هنا <b>index</b> مش أُس. مثال الجدول: x⁽¹⁾ = 2104 و y⁽¹⁾ = 460.</div>
<p><b>${E('Hypothesis')} (h):</b> دالة بتدّي تقدير y من x، يعني بتربط x بـ y (في المثال: سعر البيت من المساحة). المصطلح غريب لكنه معيار في ML.</p>
<p><b>الصيغة:</b> <span class="en">hθ(x) = θ₀ + θ₁x</span> <span class="tag">من ملخصك؛ النص المستخرج من السلايد لم يظهر الصيغة، غالبًا صورة</span></p>`,
 q:{q:'في (x⁽ⁱ⁾, y⁽ⁱ⁾) الرمز (i) يعني:',o:['أُس','Index لرقم الصف في الـ training set','عدد الـ features','قيمة الخطأ'],a:1,w:'المحاضرة أكدت إنه مش exponent.'}},
{lec:2,t:'Cost Function و MSE و MAE',x:'mse',b:`
<p><b>الـ Cost Function:</b> معادلة تقيس قد إيه توقعات النموذج بعيدة عن القيم الحقيقية، وبترجّعها كرقم واحد. الهدف أثناء التدريب: <b>نقللها</b>. بتدّي feedback وبتساعد خوارزميات زي gradient descent تعدّل المعاملات.</p>
<div class="wrap"><table><tr><th>Loss</th><th>الفكرة (حسب المحاضرة)</th></tr>
<tr><td>MSE</td><td><span class="en">(1/n) Σ (yi − ŷi)²</span> يعاقب الأخطاء الكبيرة أكتر بسبب التربيع</td></tr>
<tr><td>MAE</td><td><span class="en">(1/n) Σ |yi − ŷi|</span> أقل حساسية للـ outliers من MSE</td></tr>
<tr><td>Huber</td><td>يجمع MSE و MAE: تربيعي للأخطاء الصغيرة وخطي للكبيرة، robust للـ outliers، ويتحكم فيه البارامتر δ</td></tr>
<tr><td>Log-Cosh</td><td>لوغاريتم cosh للخطأ: تقريب smooth قابل للاشتقاق لـ MAE، أقل حساسية من MSE للـ outliers</td></tr>
<tr><td>Binary cross-entropy</td><td>للـ Classification: الفرق بين احتمالات الفئة المتوقعة والـ labels الحقيقية</td></tr>
<tr><td>Categorical cross-entropy</td><td>نفس الفكرة لأكتر من فئتين</td></tr></table></div>
<p class="tag">صيغ Huber و Log-Cosh لم تظهر في النص المستخرج، لذلك ما ضفتهاش.</p>
<p><b>Additional Explanation (مثال رقمي مني):</b> جرّب أثر الـ outlier:</p>`,
 q:{q:'أي دالة أكثر حساسية للـ outliers؟',o:['MAE','Huber','MSE','Log-Cosh'],a:2,w:'التربيع بيضخّم الأخطاء الكبيرة، والمحاضرة بتقول MAE و Huber و Log-Cosh أقل حساسية.'}},
{lec:2,t:'Balanced vs Imbalanced Data',x:'',b:`
<div class="wrap"><table><tr><th></th><th>Balanced</th><th>Imbalanced</th></tr>
<tr><td>التوزيع</td><td>الفئات متمثلة تقريبًا بالتساوي</td><td>فئة ${E('majority')} أكتر بكتير من فئة ${E('minority')}</td></tr>
<tr><td>النتيجة</td><td>نموذج غير متحيز، ومقاييس precision/recall أكثر موثوقية</td><td>النموذج بيفضّل الـ majority، و Accuracy ممكن تكون <b>مضللة</b></td></tr></table></div>
<p>أمثلة الـ imbalance: التشخيص الطبي واكتشاف الاحتيال. تقنيات التوازن المذكورة: ${E('oversampling')} و${E('undersampling')} و${E('class weighting')} (المحاضرة ذكرتهم بالاسم فقط).</p>
<p><b>Weighted Cross-Entropy (مثال المحاضرة):</b> سالب = 95%، موجب = 5%. الأوزان عكسية لتكرار الفئة: Weight_negative = 0.05، Weight_positive = 0.95.</p>
<p class="en" style="display:block">Lᵢ = − Weight_yᵢ × [ yᵢ log(ŷᵢ) + (1 − yᵢ) log(1 − ŷᵢ) ]</p>
<p>yᵢ = الـ label الحقيقي (0 أو 1)، ŷᵢ = احتمال الفئة الموجبة المتوقع. النتيجة: النموذج بيتعاقب أكتر على أخطاء الـ minority.</p>
<div class="warn"><b>خطأ شائع:</b> نموذج دقته 95% على بيانات 95/5 مش بالضرورة جيد، لأنه ممكن يتجاهل الـ minority تمامًا.</div>`,
 q:{q:'ليه Accuracy ممكن تكون مضللة مع imbalanced data؟',o:['لأنها بتتجاهل الـ majority','لأن النموذج يبدو دقيقًا بينما يفشل في اكتشاف الـ minority','لأنها دايمًا 50%','لأنها لا تتأثر بالبيانات'],a:1,w:'المحاضرة: model appears accurate but fails in detecting important minority cases.'}},
{lec:2,t:'Gradient Descent',x:'gd',b:`
<p><b>الفكرة:</b> خوارزمية optimization لتقليل الـ cost بتحديث المعاملات تكراريًا في اتجاه أشد نزول للـ cost. تخيل إنك واقف على تل بالليل ومش شايف غير الميل تحت رجليك، فبتخطو خطوة صغيرة لتحت وتكرر.</p>
<div class="note"><b>قاعدة التحديث:</b> <span class="en">new x = old x − α × gradient</span></div>
<p><b>مثال المحاضرة:</b> f(x) = x²، f′(x) = 2x، start x = 4، α = 0.1. النتيجة: 4 → 3.2 → 2.56 → 2.048 → 1.6384 … والـ minimum عند x = 0.</p>
<p><b>Learning Rate:</b> كبير = ممكن يعدّي الـ minimum (overshoot)، صغير = بطيء. بنوقف لما الخطوات تصغر جدًا.</p>
<p><b>جرّب بنفسك:</b></p>
<div id="gdw"></div>
<div class="wrap"><table><tr><th>Variant</th><th>الوصف</th><th>متى</th></tr>
<tr><td>Batch GD</td><td>الـ gradient من كل الـ training data في كل iteration</td><td>dataset صغير أو يتحمّل في الذاكرة، gradient مستقر</td></tr>
<tr><td>SGD</td><td>الـ gradient من مثال واحد في كل iteration</td><td>dataset كبير أو streaming، أسرع لكن noisy</td></tr></table></div>
<p><b>مع balanced data:</b> التحديثات متوازنة وتقارب مستقر. <b>مع imbalanced:</b> gradients الـ majority تسيطر، والنموذج يـ underfit الـ minority. الحل: weighting الـ gradients أو تعديل قواعد التحديث.</p>`,
 q:{q:'عند α كبير جدًا في gradient descent ممكن يحصل:',o:['Convergence أسرع دايمًا','Overshooting','لا يحدث شيء','الـ cost يصير صفر'],a:1,w:'المحاضرة: too big can overshoot, too small slows learning.'}},
{lec:3,t:'من Simple إلى Multiple Linear Regression',x:'',b:`
<p>في ${E('SLR')} عندنا feature واحدة x والمعادلة <span class="en">y = mx + b</span> (خط 2D في المستوى). لكن في الواقع feature واحدة نادرًا تكفي:</p>
<div class="wrap"><table><tr><th>المثال</th><th>الـ features</th></tr><tr><td>House Price</td><td>المساحة، عدد الغرف، عمر العقار، المسافة للمواصلات</td></tr><tr><td>Energy Load</td><td>الحرارة، الرطوبة، وقت اليوم، الطلب التاريخي</td></tr><tr><td>Recovery Time</td><td>الجرعة، العمر، biomarkers، مدة العلاج</td></tr></table></div>
<p>الـ ${E('Multiple Linear Regression (MLR)')} بتعمّم النموذج لـ n features (x₁…xₙ)، وبدل الخط بتبني <b>${E('hyperplane')}</b> في فضاء بُعده (n + 1).</p>`,q:Q(3)},
{lec:3,t:'الصيغة Scalar والصيغة Matrix',x:'mat',b:`
<p><b>Scalar form</b> لمشاهدة رقم i من m مشاهدة:</p>
<p class="en" style="display:block">yᵢ = β₀ + β₁xᵢ₁ + β₂xᵢ₂ + … + βₙxᵢₙ + εᵢ , i = 1…m</p>
<div class="wrap"><table><tr><th>الرمز</th><th>المعنى</th></tr><tr><td>yᵢ</td><td>القيمة المستهدفة المستمرة للمشاهدة i</td></tr><tr><td>β₀</td><td>الـ intercept: القيمة الأساسية لما كل xᵢⱼ = 0</td></tr><tr><td>βⱼ</td><td>Partial regression coefficient: التغيّر المتوقع في y لو xⱼ زادت وحدة واحدة <b>مع تثبيت باقي الـ features</b> (ceteris paribus)</td></tr><tr><td>εᵢ</td><td>خطأ عشوائي (residual)</td></tr><tr><td>m / n</td><td>عدد المشاهدات / عدد الـ features</td></tr></table></div>
<p><b>Matrix notation:</b> <span class="en">Y = Xβ + ε</span>. غيّر m و n وشوف الأبعاد:</p>`,q:Q(7)},
{lec:3,t:'OLS و Normal Equation (خطوة بخطوة)',x:'ols',b:`
<p>${E('Ordinary Least Squares')}: ندوّر على β̂ اللي بيقلل ${E('SSR')} = مجموع مربعات الـ residuals. شرط الحل: XᵀX <b>invertible (non-singular)</b>.</p>
<p>اضغط Next Step علشان تشوف كل انتقال. السطور الأساسية من المحاضرة، وشرح الانتقال Additional Explanation.</p>`,q:Q(9)},
{lec:3,t:'مميزات وعيوب Linear Regression',x:'',b:`
<div class="wrap"><table><tr><th>المميزات (حسب المحاضرة)</th><th>العيوب (حسب المحاضرة)</th></tr>
<tr><td><b>Interpretability:</b> كل βⱼ يوضح أثر xⱼ بتثبيت الباقي، وسهل معرفة الـ features المؤثرة واتجاه تأثيرها</td><td><b>Linearity assumption:</b> مش بتلقط العلاقات غير الخطية إلا بـ feature engineering (مثل حدود polynomial)</td></tr>
<tr><td><b>Computational efficiency:</b> الحل المغلق بذاكرة قليلة وتعقيد O(m·n²)</td><td><b>Outliers:</b> التربيع يعطيها leverage زائد فتسحب الخط</td></tr>
<tr><td><b>Lightweight inference:</b> dot-product بسيط xᵀβ يناسب edge devices</td><td><b>Multicollinearity:</b> لما الـ features مترابطة جدًا تبقى XᵀX شبه singular وتتضخم variance للمعاملات</td></tr></table></div>`,q:Q(22)},
{lec:3,t:'Logistic Regression و Sigmoid',x:'sig',b:`
<p>Linear regression مش مناسبة مباشرة للـ Classification لأن مخرجاتها <b>${E('unbounded')}</b> وممكن تعدّي 1 أو تنزل تحت 0. الـ Logistic regression بتقدّر <b>احتمال</b> انتماء العينة لفئة y ∈ {0, 1} باستخدام ${E('link function')}.</p>
<p class="en" style="display:block">z = wᵀx + b &nbsp;&nbsp; σ(z) = 1 / (1 + e⁻ᶻ)</p>
<p>لو σ(z) ≥ 0.5 → Class 1، غير كده Class 0. الـ ${E('decision boundary')} عند σ(z) = 0.5 أي z = 0. <b>حرّك z:</b></p>`,q:Q(14)},
{lec:3,t:'Cost Function: MSE مقابل Binary Cross-Entropy',x:'',b:`
<p>استخدام MSE مع sigmoid بيعمل سطح تكلفة <b>${E('non-convex')}</b> متعرج وفيه ${E('local minima')} كتير. فبنستخدم Binary Cross-Entropy:</p>
<p class="en" style="display:block">J(w) = −(1/m) Σᵢ [ y⁽ⁱ⁾ log(σ(z⁽ⁱ⁾)) + (1 − y⁽ⁱ⁾) log(1 − σ(z⁽ⁱ⁾)) ]</p>
<p>المحاضرة بتقول إن الدالة دي <b>convex</b> وده بيضمن إن gradient descent يلاقي الـ global minimum، والأوزان بتتحدث تكراريًا بحساب gradient الـ loss بالنسبة لكل وزن.</p>
<p><b>Additional Explanation (قراءة الصيغة):</b> الحد الأول بيشتغل لما y = 1، والثاني لما y = 0؛ في كل عينة واحد منهم بس بيفضل.</p>
<div class="note">السلايد لا يشرح سبب الـ non-convexity أو برهان الـ convexity، فمفيش تفاصيل زيادة هنا.</div>`,q:Q(15)},
{lec:3,t:'أمثلة محلولة: Raincoat و Spam',x:'ex',b:`<p>اختار مثال واضغط Next Step:</p>`,q:Q(18)},
{lec:3,t:'Polynomial Features و Regularization',x:'reg',b:`
<p><b>المشكلة:</b> Logistic regression العادية بترسم خط مستقيم. لو البيانات دايرية (Class 1 في النص وClass 0 حلقة حواليه) الخط يفشل.</p>
<p><b>الحل:</b> ${E('Polynomial features')} و${E('interaction terms')}: نغذّي النموذج بـ x₁² و x₂² و x₁x₂ بدل x₁ و x₂ فقط، فيصير الـ boundary منحني بدون تغيير الخوارزمية.</p>
<p>لما الـ features تكتر يحصل overfitting وعدم استقرار معاملات، فنضيف penalty للـ cost:</p>
<div class="wrap"><table><tr><th></th><th>L1 (Lasso)</th><th>L2 (Ridge)</th></tr><tr><td>Penalty</td><td>λΣ|w|</td><td>λΣw²</td></tr><tr><td>التأثير</td><td>ممكن يوصّل معاملات لصفر تمامًا</td><td>يقلل كل المعاملات تدريجيًا</td></tr><tr><td>الفائدة</td><td>Automated feature selection</td><td>يمنع feature واحدة تسيطر ويخفف multicollinearity</td></tr></table></div>
<p><b>Additional Explanation (توضيح رقمي بوزن افتراضي):</b></p>`,q:Q(27)},
{lec:3,t:'Linear vs Logistic Regression',x:'',b:`
<div class="wrap"><table><tr><th></th><th>Linear Regression</th><th>Logistic Regression</th></tr>
<tr><td>Type</td><td>Regression</td><td>Binary classification</td></tr>
<tr><td>Output</td><td>رقم مستمر unbounded</td><td>احتمال بين 0 و 1 (ثم Class 0/1 بـ threshold)</td></tr>
<tr><td>Function</td><td>Linear: Y = Xβ + ε</td><td>σ(z) حيث z = wᵀx + b</td></tr>
<tr><td>Cost</td><td>SSR (مجموع مربعات الـ residuals)</td><td>Binary Cross-Entropy</td></tr>
<tr><td>Optimization</td><td>OLS / Normal Equation (closed-form)</td><td>تحديث تكراري للأوزان بالـ gradient (gradient descent)</td></tr></table></div>
<p class="tag">الجدول مجمّع من محتوى المحاضرة، والسلايد نفسه لا يحتوي جدول مقارنة جاهز.</p>
<p><b>مميزات Logistic (من المحاضرة):</b> بسيطة وسهلة التفسير، بتطلّع احتمالات تقدر تعدّل threshold حسب تحمّلك للـ false positives/negatives، أداؤها كويس على البيانات القابلة للفصل خطيًا، ومع L1/L2 بتقل مخاطرة الـ overfitting، ومش بتتطلب feature scaling بشكل صارم.</p>`,q:Q(12)},
{lec:4,t:'K-Means Clustering: الفكرة',x:'',b:`
<p>الـ ${E('K-Means')} تقنية ${E('Unsupervised Learning')} بتقسّم dataset غير معنونة (${E('untagged / unlabeled')}) لعناقيد (${E('clusters')}). الـ <b>K</b> = عدد العناقيد المحدد مسبقًا (K=2 يعني عنقودين، K=3 تلاتة…). كل نقطة بتنتمي لمجموعة واحدة فقط من نقط متشابهة الخصائص، من غير تدريب مسبق.</p>
<p><b>Clustering:</b> تقسيم البيانات لمجموعات بحيث النقط في نفس العنقود أشبه ببعضها منها بالعناقيد التانية.</p>
<div class="wrap"><table><tr><th>الأهداف الأساسية</th><th>أمثلة من المحاضرة</th></tr><tr><td>تعظيم التشابه داخل العنقود (${E('Intra-cluster similarity')})<br>تقليل التشابه بين العناقيد (${E('Inter-cluster')})<br>اكتشاف أنماط طبيعية بدون labels</td><td>تجميع العملاء حسب سلوك الشراء · تنظيم الصور حسب التشابه · أنواع المرضى من القياسات · تقسيم المستندات حسب الموضوع</td></tr></table></div>
<p>الخوارزمية <b>${E('centroid-based')}</b>: كل عنقود له ${E('centroid')}، وهدفها تقليل إجمالي المسافة بين النقط ومراكز عناقيدها. وبتعمل مهمتين: تحدد مواقع k centroids تكراريًا، وتسند كل نقطة لأقرب مركز.</p>
<div class="warn"><b>خطأ شائع:</b> K-Means مش Classification. مفيش labels أصلًا.</div>`,q:Q(31)},
{lec:4,t:'خطوات K-Means (جرّبها بنفسك)',x:'kmeans',b:`
<ol><li>اختار K.</li><li>اختار K نقاط عشوائية كـ centroids (ممكن تكون من خارج الـ dataset).</li><li>اسند كل نقطة لأقرب centroid.</li><li>احسب centroid جديد لكل cluster (center of gravity).</li><li>أعد الإسناد لأقرب centroid.</li><li>لو حصل reassignment ارجع للخطوة 4، وإلا انتهِ.</li><li>النموذج جاهز.</li></ol>
<p>الرسم التالي بنقاط افتراضية مني (مش من السلايد). اضغط Next Step:</p>`,q:Q(39)},
{lec:4,t:'اختيار K: Elbow وSilhouette وغيرهم',x:'elbow',b:`
<p><b>Elbow Method:</b> أشهر طريقة، بتستخدم <b>${E('WCSS')}</b> = ${E('Within Cluster Sum of Squares')}: مجموع مربعات المسافات بين كل نقطة ومركز عنقودها، أي إجمالي التباين داخل العناقيد. بنرسم WCSS لقيم K مختلفة ونختار K عند "الكوع".</p>
<p><b>Domain Knowledge:</b> أحيانًا فهمك للمشكلة يحدد K (مثلًا متطلبات العمل تقول 3–5 شرائح عملاء).</p>
<p><b>Gap Statistic:</b> بنقارن التباين داخل العناقيد لكل K مع قيمته المتوقعة تحت توزيع مرجعي عشوائي (null)، وأفضل K عند أكبر gap.</p>
<p><b>Silhouette:</b> بيقيس مدى ملاءمة النقطة لعنقودها مقارنة بالعناقيد التانية. القيم من <b>−1 إلى +1</b> والأعلى أفضل، ونختار K ذو أعلى متوسط.</p>
<svg viewBox="0 0 300 50"><line x1="20" y1="25" x2="280" y2="25" stroke="var(--mu)"/><text x="10" y="45" fill="var(--tx)" font-size="11">−1</text><text x="145" y="45" fill="var(--tx)" font-size="11">0</text><text x="270" y="45" fill="var(--tx)" font-size="11">+1</text><text x="150" y="14" fill="var(--ok)" font-size="11" text-anchor="middle">الأعلى = أفضل</text></svg>
<p class="note"><b>Additional:</b> منحنى الـ Elbow أدناه محسوب من نقاط افتراضية (نفس نقاط الدرس السابق) بتشغيل K-Means لكل K:</p>`,q:Q(40)},
{lec:4,t:'قياس المسافة: Euclidean و Manhattan',x:'dist',b:`
<p>المحاضرة بتذكر إن المسافة بين النقط والـ centroids ممكن تتقاس بـ ${E('Euclidean distance')} أو ${E('Manhattan distance')}. صيغة Euclidean المستخدمة في المثال الرقمي: <span class="en">√((X₀−X꜀)² + (Y₀−Y꜀)²)</span>.</p>
<p class="note"><b>Additional Explanation:</b> Manhattan = |Δx| + |Δy| (حركة أفقية ورأسية)، والمحاضرة لم تعطِ صيغتها. حرّك الفرق:</p>`,q:Q(37)},
{lec:4,t:'مميزات وعيوب K-Means',x:'',b:`
<div class="wrap"><table><tr><th>المميزات</th><th>العيوب</th></tr>
<tr><td><b>Easy implementation:</b> تكرارية وبسيطة ويمكن تنفيذها يدويًا</td><td><b>Deciding K:</b> تحدي ويحتاج طرق مثل elbow</td></tr>
<tr><td><b>Scalability:</b> من 10 سجلات لـ 10 مليون</td><td><b>Initial centroids:</b> الكفاءة تعتمد على اختيارها بعناية</td></tr>
<tr><td><b>Convergence:</b> مضمون إنها تطلع نتيجة في كل مرة</td><td><b>Outliers:</b> تأثر موضع الـ centroids وتسبب عدم دقة، وتخفيف ذلك بإزالتها أثناء data cleaning</td></tr>
<tr><td><b>Generalization:</b> تنفع لبيانات رقمية أو مستندات نصية وبأحجام وتوزيعات مختلفة</td><td></td></tr>
<tr><td><b>Choice of centroids:</b> سهولة اختيار وإسناد المراكز</td><td></td></tr></table></div>`,q:Q(44)},
{lec:4,t:'مثال رقمي: Height / Weight',x:'kme',b:`
<p>البيانات (Height, Weight) كما في المحاضرة، والمطلوب عنقودين K=2 بالمسافة الإقليدية. المحاضرة بتبدأ بنقطتين كمراكز، وبعدين تدخل النقط واحدة واحدة وتحدّث مركز العنقود بعد كل إضافة.</p>
<div class="warn"><b>تنبيه على السلايد:</b> الإجابة النهائية المكتوبة بخط اليد فيه أرقام نقاط حتى 12 بينما الجدول 9 صفوف فقط، لذلك ماقدرتش أطابق نتيجتي النهائية معاها. الخطوات المؤكدة هي النقطة 3: المسافتان 20.80 و 4.47، المركز الجديد (169, 58).</div>
<p>اضغط Next Step (الحساب تلقائي بنفس أسلوب المحاضرة):</p>`,q:Q(41)},
{lec:4,t:'Naïve Bayes و Bayes Theorem',x:'bayes',b:`
<p>${E('Naïve Bayes')} طريقة <b>Classification</b> مبنية على Bayes’ Theorem بافتراض الاستقلال بين الـ predictors: وجود feature في class غير مرتبط بوجود أي feature تانية. بتُستخدم في ${E('Supervised learning')} (مثل ${E('text classification')} و${E('spam filtering')} و${E('sentiment analysis')}) وهي من ${E('Generative learning algorithms')} اللي بتنمذج توزيع المدخلات لكل class. الافتراض: بمعلومية الـ class، الـ features ${E('conditionally independent')}.</p>
<p>مثال التفاحة: أحمر، دائري، قطره 3 بوصة، حتى لو مترابطين، كل واحدة بتساهم باستقلال، ومن هنا اسم "Naïve". ورغم تبسيطه فكتير بيتفوق على طرق أعقد وبيناسب البيانات الكبيرة.</p>
<p class="en" style="display:block;font-size:1.1rem">P(A|B) = P(B|A) × P(A) / P(B)</p>
<div class="wrap"><table><tr><th>الرمز</th><th>الاسم</th><th>المعنى</th></tr><tr><td>P(A|B)</td><td>Posterior</td><td>احتمال الفرضية A بعد ملاحظة الحدث B</td></tr><tr><td>P(B|A)</td><td>Likelihood</td><td>احتمال الدليل لو الفرضية صحيحة</td></tr><tr><td>P(A)</td><td>Prior</td><td>احتمال الفرضية قبل رؤية الدليل</td></tr><tr><td>P(B)</td><td>Marginal</td><td>احتمال الدليل</td></tr></table></div>
<p><b>جرّب بأرقام مثال Weather:</b></p>`,q:Q(47)},
{lec:4,t:'كيف يعمل Naïve Bayes: Weather و Fruit',x:'nbex',b:`
<p><b>الخطوات:</b> (1) حوّل الـ dataset إلى ${E('Frequency tables')}. (2) ابنِ ${E('Likelihood table')}. (3) احسب الـ ${E('posterior')} بنظرية Bayes، واختر الـ class ذو الاحتمال الأعلى.</p>
<p class="tag">جداول التكرار الأصلية صور في السلايد، فبعرض الأرقام المكتوبة فقط.</p>
<p>اضغط Next Step لكل مثال:</p>`,q:Q(49)},
{lec:4,t:'أنواع Naïve Bayes ومميزاته وعيوبه',x:'',b:`
<div class="wrap"><table><tr><th>النوع</th><th>الافتراض / الاستخدام</th></tr>
<tr><td>Gaussian</td><td>الـ features <b>مستمرة</b> وبتتبع توزيع طبيعي (normal)</td></tr>
<tr><td>Multinomial</td><td>للبيانات multinomial، مناسب لتصنيف المستندات (رياضة، سياسة، تعليم…)، والـ predictors = <b>تكرار الكلمات</b></td></tr>
<tr><td>Bernoulli</td><td>زي Multinomial لكن الـ predictors متغيرات <b>Boolean</b> مستقلة (الكلمة موجودة أم لا)، شهير أيضًا لتصنيف المستندات</td></tr></table></div>
<div class="wrap"><table><tr><th>المميزات</th><th>العيوب</th></tr><tr><td>سريع وسهل · Binary و Multi-class · أداء جيد في multi-class مقارنة بغيره · الأشهر لتصنيف النصوص</td><td>يفترض استقلال كل الـ features، فلا يقدر يتعلم العلاقات بينها</td></tr></table></div>`,q:Q(53)},
{lec:4,t:'K-Means vs Naïve Bayes',x:'',b:`
<div class="wrap"><table><tr><th></th><th>K-Means</th><th>Naïve Bayes</th></tr>
<tr><td>التعلم</td><td>Unsupervised</td><td>Supervised (Generative)</td></tr>

<tr><td>تطبيقات</td><td>تقسيم العملاء، الصور، المرضى، المستندات</td><td>Spam filtering، Sentiment analysis، Text classification</td></tr></table></div>
